name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  # « Run workflow » : compile et publie une version depuis n'importe quelle branche.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Le SDK Android est déjà installé sur les runners ubuntu-latest (ANDROID_HOME).
      - run: npm ci
      # Numéro de compilation croissant : l'appli le compare à la dernière version publiée.
      - name: Numéro de version
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const build = Number(process.env.GITHUB_RUN_NUMBER);
            app.expo.version = '1.0.' + build;
            app.expo.android.versionCode = build;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "
      # Génère le projet natif android/ à partir de app.json (non versionné).
      - run: npx expo prebuild --platform android --no-install
      # APK de release signé avec la clé de debug du modèle Expo, identique à chaque compilation :
      # une nouvelle version s'installe par-dessus l'ancienne sans perdre les plantes.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk MesRecettes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MesRecettes-apk
          path: MesRecettes.apk
          if-no-files-found: error
      # Version proposée dans l'appli : chaque fusion dans main, ou un lancement à la main.
      - name: Publier la version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="$GITHUB_RUN_NUMBER"
          git log -1 --pretty=%B \
            | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' -e '^Merge pull request' -e '^Merge branch' \
            | sed '/./,$!d' > notes.txt
          gh release create "build-$N" MesRecettes.apk --title "MesRecettes 1.0.$N" --notes-file notes.txt --target "$GITHUB_SHA" \
            || gh release upload "build-$N" MesRecettes.apk --clobber
